name: Fingether
options:
  bundleIdPrefix: com.fingether
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true

settings:
  base:
    INFOPLIST_FILE: Spendly/Resources/Info.plist
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

targets:
  Spendly:
    type: application
    platform: iOS
    sources:
      - path: Spendly
        excludes:
          - Resources/Info.plist
    resources:
      - path: Spendly/Resources
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: Spendly/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.fingether.app
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SUPABASE_URL: "https://your-project.supabase.co"
          SUPABASE_ANON_KEY: "your-anon-key-here"
        Release:
          SUPABASE_URL: "https://your-project.supabase.co"
          SUPABASE_ANON_KEY: "your-anon-key-here"
    dependencies:
      - package: Supabase
    entitlements:
      path: Spendly/Spendly.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

  SpendlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpendlyTests
    dependencies:
      - target: Spendly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fingether.app.tests

  SpendlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpendlyUITests
    dependencies:
      - target: Spendly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fingether.app.uitests
